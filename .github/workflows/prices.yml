name: Lowest prices in Europe

on:
  schedule:
    - cron: "40 5 * * 1"          # Mondays 05:40 UTC, after the driver scan
  workflow_dispatch:
  push:
    paths: ["watch/prices.py", "watch/prices_config.json", ".github/workflows/prices.yml"]

permissions:
  contents: write

concurrency:
  group: watch-new-drivers        # shares the group with the other jobs that commit to the repository
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Start from the newest prices file (hand-written fields and kept offers are carried from it)
        run: git fetch origin "${GITHUB_REF_NAME}" && git checkout "origin/${GITHUB_REF_NAME}" -- prices.json prices.md || true
      - name: Scan the shops
        run: python3 watch/prices.py --summary "$GITHUB_STEP_SUMMARY"
      - name: Commit prices.json
        run: |
          FILES="prices.json prices.md"
          git add $FILES
          if git diff --cached --quiet; then echo "unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # this run's files are whole results and replace the committed ones outright (a merge of two runs' files
          # mixes them): the commit is made on the branch's newest commit, the files kept in a tar meanwhile
          tar cf /tmp/run-files.tar $FILES
          for try in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset -q --hard "origin/${GITHUB_REF_NAME}"
            tar xf /tmp/run-files.tar
            git add $FILES
            if git diff --cached --quiet; then echo "unchanged against the branch's newest commit"; exit 0; fi
            git commit -q -m "Prices: scan of European shops"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep $((try * 15))
          done
          echo "could not push after five tries"; exit 1

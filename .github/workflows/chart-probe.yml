name: Chart probe

# Measures the chart images of the drivers listed in capture/chart_probe_request.txt (size, plot
# frame, curve colours, axis labels read with tesseract) and commits the numbers to
# capture/chart_probe.json. Images are read on the runner only; none is stored.
on:
  push:
    paths:
      - "capture/chart_probe_request.txt"
      - "capture/chart_probe.py"
      - ".github/workflows/chart-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chart-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr > /dev/null
          python3 -m pip install -q pillow numpy
      - name: Probe the charts
        shell: bash   # pipefail: a crash of the script fails the step (tee alone would hide it)
        run: python3 capture/chart_probe.py --limit "${PROBE_LIMIT:-0}" | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          PROBE_LIMIT: ${{ vars.PROBE_LIMIT || 2 }}
      - name: Commit the results
        run: |
          FILES="capture/chart_probe.json"
          git add $FILES
          if git diff --cached --quiet; then echo "unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # this run's files are whole results and replace the committed ones outright (a merge of two runs' files
          # mixes them): the commit is made on the branch's newest commit, the files kept in a tar meanwhile
          tar cf /tmp/run-files.tar $FILES
          for try in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset -q --hard "origin/${GITHUB_REF_NAME}"
            tar xf /tmp/run-files.tar
            git add $FILES
            if git diff --cached --quiet; then echo "unchanged against the branch's newest commit"; exit 0; fi
            git commit -q -m "Chart probe: sizes, frames, colours and axis labels of the requested charts"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep $((try * 15))
          done
          echo "could not push after five tries"; exit 1

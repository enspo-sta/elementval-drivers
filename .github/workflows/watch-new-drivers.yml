name: Watch for new drivers

# Weekly scan of the manufacturer and test-lab sites listed in watch/config.json.
# Models that appear on a measurement page for the first time become issues labelled
# "new-driver"; new measurement pages for drivers already in the database become one
# "driver-update" issue. State is committed to watch/state.json so each model is
# reported once, and watch/coverage.md (where each driver is measured) is rebuilt.
on:
  schedule:
    - cron: "17 4 * * 1"          # Mondays 04:17 UTC (06:17 Swedish summer time)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Scan and report only (no issues, no commit)"
        type: boolean
        default: false
  push:                            # changes to the watcher itself get a dry run
    paths:
      - "watch/watch_sources.py"
      - "watch/common.py"
      - "watch/coverage.py"
      - "watch/config.json"
      - ".github/workflows/watch-new-drivers.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: watch-new-drivers
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DRY_RUN: ${{ github.event_name == 'push' || inputs.dry_run == true }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan sources
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python3 watch/watch_sources.py --dry-run --out findings.json --summary "$GITHUB_STEP_SUMMARY"
            python3 watch/coverage.py --state findings.state.json --stdout
          else
            python3 watch/watch_sources.py --out findings.json --summary "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open issues
        if: env.DRY_RUN != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 watch/open_issues.py findings.json

      - name: Rebuild coverage list
        if: env.DRY_RUN != 'true'
        run: python3 watch/coverage.py

      - name: Commit scan state
        if: env.DRY_RUN != 'true'
        run: |
          FILES="watch/state.json watch/catalogue.md watch/coverage.md watch/coverage.json"
          git add $FILES
          if git diff --cached --quiet; then echo "unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # this run's files are whole results and replace the committed ones outright (a merge of two runs' files
          # mixes them): the commit is made on the branch's newest commit, the files kept in a tar meanwhile
          tar cf /tmp/run-files.tar $FILES
          for try in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset -q --hard "origin/${GITHUB_REF_NAME}"
            tar xf /tmp/run-files.tar
            git add $FILES
            if git diff --cached --quiet; then echo "unchanged against the branch's newest commit"; exit 0; fi
            git commit -q -m "Driver watch: scan of $(date -u +%F)"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep $((try * 15))
          done
          echo "could not push after five tries"; exit 1

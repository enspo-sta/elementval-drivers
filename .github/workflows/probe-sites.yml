name: Temporary site probe
on:
  push:
    paths: [".github/workflows/probe-sites.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: pip install --quiet pymupdf
      - name: Probe 2
        shell: python3 {0}
        run: |
          import urllib.request, urllib.parse, re, html, time, struct, gzip, pymupdf
          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          def get(u, raw=False):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": UA, "Accept-Encoding": "gzip"}), timeout=40)
                  b = r.read()
                  if r.headers.get("Content-Encoding") == "gzip": b = gzip.decompress(b)
                  return r.status, r.geturl(), (b if raw else b.decode("utf-8", "replace"))
              except Exception as e:
                  return getattr(e, "code", 0), u, (b"" if raw else f"ERROR {e}")
          def text(s):
              s = re.sub(r"<(script|style|noscript)\b.*?</\1>", " ", s, flags=re.S | re.I)
              return re.sub(r"\s+", " ", html.unescape(re.sub(r"<[^>]+>", " ", s))).strip()
          def imgsize(b):
              if b[:8] == b"\x89PNG\r\n\x1a\n": return struct.unpack(">II", b[16:24])
              if b[:4] == b"RIFF" and b[8:12] == b"WEBP": return ("webp", len(b))
              if b[:2] == b"\xff\xd8":
                  i = 2
                  while i < len(b):
                      if b[i] != 0xFF: i += 1; continue
                      m = b[i+1]
                      if m in (0xC0, 0xC1, 0xC2): h, w = struct.unpack(">HH", b[i+5:i+9]); return (w, h)
                      i += 2 + struct.unpack(">H", b[i+2:i+4])[0]
              return None

          print("\n### PURIFI PDF VECTOR CURVES")
          st, fu, pb = get("https://hificompass.com/sites/default/files/documents/ptt5.25x04-naa-05_data_sheet.pdf", raw=True)
          doc = pymupdf.open(stream=pb, filetype="pdf")
          for pno in (2, 3):
              p = doc[pno]
              caps = [b[4].strip().replace("\n", " ") for b in p.get_text("blocks") if re.match(r"\s*Figure", b[4])]
              print(f"\npage {pno+1} captions: {caps}")
              polys = []
              for d in p.get_drawings():
                  segs = [it for it in d["items"] if it[0] in ("l", "c")]
                  if len(segs) >= 40:
                      xs = [pt.x for it in segs for pt in it[1:] if hasattr(pt, "x")]
                      polys.append((len(segs), d.get("color"), d.get("width"), tuple(round(v) for v in d["rect"]), round(min(xs)), round(max(xs))))
              polys.sort(key=lambda t: -t[0])
              print(f"  long paths (>=40 segments): {len(polys)}")
              for t in polys[:25]: print("   segments=%d color=%s width=%s rect=%s" % t[:4])

          print("\n### AUDIOHORN TEST PAGES")
          for u in ["https://audiohorn.net/test/woofer/6-7inch/", "https://audiohorn.net/test/medium/8inch/"]:
              st, fu, b = get(u); t = text(b)
              print(f"\nPAGE {u} status {st} {len(b)} bytes"); print(t[:5000])
              imgs = re.findall(r'<img[^>]+src=["\']([^"\']+)', b)
              print("IMAGES:", len(imgs)); print("\n".join(imgs[:40]))
              for im in imgs[:3]:
                  iu = urllib.parse.urljoin(fu, im); s2, _, ib = get(iu, raw=True); print("  img", iu, s2, len(ib), imgsize(ib)); time.sleep(1)
              print("DATA LINKS:", [l for l in re.findall(r'href=["\']([^"\']+)', b) if re.search(r"\.(zip|pdf|frd|zma|txt|csv|mdat)(\?|$)", l, re.I)])
              time.sleep(2)

          print("\n### AUDIOXPRESS PURIFI TAG")
          st, fu, b = get("https://audioxpress.com/tags/purifi-audio/")
          arts = sorted(set(urllib.parse.urljoin(fu, h) for h in re.findall(r'href=["\']([^"\']*/article/[^"\']+)', b)))
          print(st, len(arts)); print("\n".join(arts))

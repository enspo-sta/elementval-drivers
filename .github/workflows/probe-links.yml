name: Temporary link check
on:
  push:
    branches: [claude/driver-database-auto-update-5o8ylq]
    paths: [".github/workflows/probe-links.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          for u in https://www.linkwitzlab.com/filters.htm https://www.ranecommercial.com/legacy/note160.html \
                   https://jfly.uni-koeln.de/color/ https://www.chartjs.org/docs/4.4.1/ \
                   https://www.diyaudio.com/community/threads/371979/ https://www.parts-express.com/ \
                   https://purifi-audio.com/ https://hificompass.com/en/speakers/measurements \
                   https://www.erinsaudiocorner.com/driveunits/ https://audiohorn.net/; do
            code=$(curl -s -L --max-time 25 -A "Mozilla/5.0 (link check)" -o page.html -w "%{http_code} %{url_effective}" "$u")
            title=$(tr '\n' ' ' < page.html | grep -o -i '<title[^>]*>[^<]*' | head -1 | sed 's/<title[^>]*>//I' | cut -c1-120)
            echo "PROBE $u -> $code | $title"
            grep -o -i -E 'Linkwitz-Riley[^<]{0,80}|Butterworth[^<]{0,60}|Color Universal Design[^<]{0,60}' page.html | head -3 | sed 's/^/   /'
          done

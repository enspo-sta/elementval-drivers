name: Backup

# Weekly backup of the whole repository: the viewer and scripts, the driver
# database, and the full history of every branch. Each run makes two files:
#   elementval-drivers-<date>.bundle       everything, with full history
#                                          (restore with: git clone <file>)
#   elementval-drivers-files-<date>.zip    the current files on main, usable without Git
# The run first proves the backup restores, then keeps both files as a download on
# the run page (Actions → Backup → the run → Artifacts) for 90 days, and, once the
# secret GOOGLE_DRIVE_BACKUP_URL is set up (see BACKUP.md), also saves them in your
# Google Drive, outside GitHub.
on:
  schedule:
    - cron: "40 3 * * 0"          # Sundays 03:40 UTC
  workflow_dispatch:
  push:                            # a change to this file runs it once as a test
    paths: [".github/workflows/backup.yml"]

permissions:
  contents: read
  issues: write          # only used to open a "Backup failed" issue

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DRIVE_URL: ${{ secrets.GOOGLE_DRIVE_BACKUP_URL }}   # empty until set up (BACKUP.md)
    steps:
      - name: Copy the repository with its full history
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git clone --quiet --mirror "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo.git

      - name: Make the backup files
        run: |
          d=$(date -u +%F)
          mkdir backup
          # branches and tags only (a mirror copy also carries GitHub's internal pull request references)
          git -C repo.git bundle create "$PWD/backup/elementval-drivers-$d.bundle" HEAD --branches --tags
          git -C repo.git bundle verify --quiet "$PWD/backup/elementval-drivers-$d.bundle"
          git -C repo.git archive --format=zip -o "$PWD/backup/elementval-drivers-files-$d.zip" HEAD
          echo "BACKUP_DATE=$d" >> "$GITHUB_ENV"

      - name: Prove the backup restores
        run: |
          git clone --quiet "backup/elementval-drivers-${BACKUP_DATE}.bundle" restore-test
          python3 -c "import json; [json.load(open(f'restore-test/{f}')) for f in ('drivers.json', 'drivers_survey_midbass.json')]"
          test -s restore-test/index.html
          echo "Restored $(git -C restore-test rev-list --all --count) commits on $(git -C restore-test branch -r | grep -vc HEAD) branches"
          ls -la backup
          {
            echo "### Backup ${BACKUP_DATE}"
            echo ""
            echo "Restored and checked: $(git -C restore-test rev-list --all --count) commits; drivers.json and index.html present."
            echo "Download it under **Artifacts** below (kept 90 days)."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: elementval-drivers-backup-${{ env.BACKUP_DATE }}
          path: backup/
          retention-days: 90
          if-no-files-found: error

      - name: Save the backup in Google Drive
        if: env.DRIVE_URL != ''
        run: |
          for f in backup/*; do
            name=$(basename "$f")
            base64 -w 0 "$f" > body.txt
            # the receiver answers through a redirect, so follow it (-L); curl then fetches the answer with GET
            curl -sS -L --fail --max-time 120 -H "Content-Type: text/plain" --data-binary @body.txt \
                 "${DRIVE_URL}?name=${name}" > answer.json
            python3 - "$f" <<'PY'
          import json, os, sys
          answer = json.load(open("answer.json"))
          size = os.path.getsize(sys.argv[1])
          if not answer.get("ok") or answer.get("bytes") != size:
              sys.exit(f"Google Drive did not store {sys.argv[1]} correctly: {answer}")
          print(f"Saved in Google Drive: {answer['name']} ({size} bytes)")
          PY
          done
          echo "Also saved in Google Drive, folder 'elementval-drivers backups'." >> "$GITHUB_STEP_SUMMARY"

      - name: Remind about the Google Drive copy
        if: env.DRIVE_URL == ''
        run: |
          echo "::notice::Only kept on GitHub. To also keep a copy in your Google Drive, follow BACKUP.md (one-time, about 5 minutes)."
          echo "Not copied outside GitHub yet: see BACKUP.md to add the Google Drive copy." >> "$GITHUB_STEP_SUMMARY"

      - name: Open an issue if the backup failed
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import datetime, json, os, urllib.error, urllib.request
          repo, run = os.environ["GITHUB_REPOSITORY"], os.environ["RUN_URL"]
          def gh(method, path, body=None):
              req = urllib.request.Request("https://api.github.com" + path, method=method,
                                           data=json.dumps(body).encode() if body is not None else None,
                                           headers={"Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                                                    "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read() or "null")
          try:
              gh("POST", f"/repos/{repo}/labels", {"name": "backup-failed", "color": "e06c75",
                                                   "description": "The weekly backup did not complete"})
          except urllib.error.HTTPError as e:
              if e.code != 422:            # 422: the label already exists
                  raise
          text = (f"The weekly backup failed on {datetime.date.today()}. What went wrong: {run}\n\n"
                  "See BACKUP.md. Close this issue once a backup has succeeded again.")
          already = gh("GET", f"/repos/{repo}/issues?labels=backup-failed&state=open")
          if already:
              gh("POST", f"/repos/{repo}/issues/{already[0]['number']}/comments", {"body": text})
          else:
              gh("POST", f"/repos/{repo}/issues", {"title": "Backup failed", "body": text, "labels": ["backup-failed"]})
          PY

name: Validate driver database

on:
  push:
    paths: ["drivers.json", "drivers_survey_midbass.json", "prices.json", "watch/**", "schema/**", "app/**", "capture/**",
            "tools/**", "tests/**", "index.html", "package.json", ".github/workflows/validate-db.yml"]
  pull_request:
    paths: ["drivers.json", "drivers_survey_midbass.json", "prices.json", "watch/**", "schema/**", "app/**", "capture/**",
            "tools/**", "tests/**", "index.html", "package.json"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: python3 watch/validate_db.py
      - name: Coverage list builds
        run: python3 watch/coverage.py --stdout > /dev/null
      - name: Consistency report builds
        run: python3 watch/check_consistency.py --stdout > /dev/null
      - name: Capture work list builds
        run: python3 capture/worklist.py
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Viewer modules parse
        run: for f in app/*.js app/*/*.js tools/*.mjs; do node --check "$f"; done
      - name: Viewer tests (maths, comparison rules, exports)
        run: node --test tests/*.test.mjs
      - name: Capture tool tests
        run: |
          python3 -m pip install --quiet pymupdf pillow numpy
          python3 -m unittest discover -s tests -p "test_*.py" -v

  # The viewer in a real browser: every tab, exports, an empty search, phone to laptop screen sizes.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  # After a change lands on main, rebuild watch/coverage.md, watch/consistency.md and capture/WORKLIST.md.
  coverage:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: watch-new-drivers
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: python3 watch/coverage.py
      - run: python3 watch/check_consistency.py
      # completeness first: the work list reads watch/completeness.json
      - run: python3 capture/completeness.py
      - run: python3 capture/worklist.py
      - run: node tools/sim_coverage.mjs
      - name: Commit coverage list, consistency report and work list
        run: |
          FILES="watch/coverage.md watch/coverage.json watch/consistency.md capture/WORKLIST.md watch/sim_coverage.md watch/completeness.md watch/completeness.json"
          git add $FILES
          if git diff --cached --quiet; then echo "unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # this run's files are whole results and replace the committed ones outright (a merge of two runs' files
          # mixes them): the commit is made on the branch's newest commit, the files kept in a tar meanwhile
          tar cf /tmp/run-files.tar $FILES
          for try in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset -q --hard "origin/${GITHUB_REF_NAME}"
            tar xf /tmp/run-files.tar
            git add $FILES
            if git diff --cached --quiet; then echo "unchanged against the branch's newest commit"; exit 0; fi
            git commit -q -m "Coverage list, consistency report and work list: rebuild after database change"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep $((try * 15))
          done
          echo "could not push after five tries"; exit 1

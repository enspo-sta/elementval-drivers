name: Temporary site probe
on:
  push:
    paths: [".github/workflows/probe-sites.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe backup documentation
        shell: python3 {0}
        run: |
          import urllib.request, re, html, gzip
          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          def get(u):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": UA, "Accept-Encoding": "gzip"}), timeout=40)
                  b = r.read()
                  if r.headers.get("Content-Encoding") == "gzip": b = gzip.decompress(b)
                  return r.status, r.geturl(), b.decode("utf-8", "replace")
              except Exception as e:
                  return getattr(e, "code", 0), u, f"ERROR {e}"
          def text(s):
              s = re.sub(r"<(script|style|noscript|nav|header|footer)\b.*?</\1>", " ", s, flags=re.S | re.I)
              return re.sub(r"\s+", " ", html.unescape(re.sub(r"<[^>]+>", " ", s))).strip()
          pages = [
            "https://docs.github.com/en/authentication/securing-your-account-with-two-factor-authentication-2fa/about-two-factor-authentication",
            "https://docs.github.com/en/authentication/securing-your-account-with-two-factor-authentication-2fa/configuring-two-factor-authentication-recovery-methods",
            "https://github.com/actions/upload-artifact/releases/latest",
            "https://desktop.github.com/download/",
          ]
          for u in pages:
              st, fu, b = get(u)
              t = text(b) if not u.endswith(".md") else b
              print(f"\n==== PAGE {u} -> {fu} status {st} chars {len(t)}")
              print(t[:16000])

name: Inventory of measurement pages

# Reads the HiFiCompass measurement page of each model given and writes what it offers (chart
# addresses, data files, tables) to capture/inventory.json and .md for the capture routine.
# The cloud sessions cannot reach hificompass.com; GitHub can. No page or image is stored.
on:
  push:                            # the models to read are listed in capture/inventory_request.txt
    paths:
      - "capture/inventory_request.txt"
      - "capture/inventory.py"
      - ".github/workflows/inventory.yml"
  workflow_dispatch:
    inputs:
      models:
        description: "Models, comma-separated (else capture/inventory_request.txt is read)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: inventory
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Read the pages
        env:
          MODELS: ${{ inputs.models }}
        run: |
          if [ -z "$MODELS" ]; then MODELS="$(tr '\n' ',' < capture/inventory_request.txt)"; fi
          python3 capture/inventory.py --models "$MODELS" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit the inventory
        run: |
          FILES="capture/inventory.json capture/inventory.md"
          git add $FILES
          if git diff --cached --quiet; then echo "unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # this run's files are whole results and replace the committed ones outright (a merge of two runs' files
          # mixes them): the commit is made on the branch's newest commit, the files kept in a tar meanwhile
          tar cf /tmp/run-files.tar $FILES
          for try in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset -q --hard "origin/${GITHUB_REF_NAME}"
            tar xf /tmp/run-files.tar
            git add $FILES
            if git diff --cached --quiet; then echo "unchanged against the branch's newest commit"; exit 0; fi
            git commit -q -m "Inventory: HiFiCompass pages (capture/inventory_request.txt)"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep $((try * 15))
          done
          echo "could not push after five tries"; exit 1

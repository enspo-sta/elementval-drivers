<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Driver DB">
<title>Driver database</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="./compare-core.js"></script>
<script src="./sim-core.js"></script>
<script src="./tools.js"></script>
<style>
  :root{--ink:#0e1016;--panel:#161a24;--panel2:#1c2230;--line:#2b3344;--text:#eef0f6;--muted:#a3acc2;--dim:#7b859c;--amber:#f0a44a;--amber2:#f6c48a;--green:#6fd19a;--red:#e98b8b}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--ink);color:var(--text);font-family:"IBM Plex Sans",system-ui,sans-serif;line-height:1.5;padding:18px 16px calc(40px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto}
  .mono{font-family:"IBM Plex Mono",monospace}
  .kick{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--amber);display:flex;justify-content:space-between}
  h1{font-family:"Fraunces",serif;font-weight:900;font-size:30px;margin:6px 0 16px}
  input.filter{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 12px;font-family:"IBM Plex Mono",monospace;font-size:14px;outline:none;margin-bottom:10px}
  .ds{display:flex;align-items:center;gap:8px;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);margin-bottom:14px;cursor:pointer;user-select:none}
  .ds input{accent-color:var(--amber);width:15px;height:15px}
  .rolehdr{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin:18px 0 8px;border-bottom:1px solid var(--line);padding-bottom:6px}
  .srchdr{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--green);margin:26px 0 2px;padding-top:10px;border-top:1px solid var(--line);display:flex;justify-content:space-between}
  .srchdr span:last-child{color:var(--dim);letter-spacing:.06em}
  .srchdr .relt{font-weight:400;color:var(--muted);letter-spacing:.06em}
  .card .srcs{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--green);margin-top:3px}
  .card{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;color:inherit;cursor:pointer}
  .card .nm{font-weight:600;font-size:16px}
  .card .sub{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);margin-top:4px}
  .back{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px 14px;font-size:14px;margin-bottom:14px;cursor:pointer}
  h2{font-family:"Fraunces",serif;font-weight:600;font-size:22px}
  .meta{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);margin:4px 0 14px}
  .tsgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}
  .ts{background:var(--panel2);border-radius:9px;padding:8px}
  .ts .k{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--dim)}
  .ts .v{font-family:"IBM Plex Mono",monospace;font-size:14px}
  .tsmore{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--dim);margin-bottom:18px}
  .tsmore b{color:var(--muted);font-weight:500}
  .setttl{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--amber2);display:flex;justify-content:space-between;align-items:center;gap:10px;margin:16px 0 6px}
  .setttl span:first-child{flex:1}
  .conf{font-family:"IBM Plex Mono",monospace;font-size:10px;padding:2px 8px;border-radius:999px;text-transform:uppercase;white-space:nowrap}
  .chartbox{background:#11141d;border:1px solid var(--line);border-radius:12px;padding:10px;position:relative;height:230px}
  .dtable{width:100%;border-collapse:collapse;font-family:"IBM Plex Mono",monospace;font-size:12.5px;background:#11141d;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .dtable th{text-align:left;color:var(--dim);font-weight:500;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:8px 12px;border-bottom:1px solid var(--line)}
  .dtable td{padding:7px 12px;border-bottom:1px solid #232b3a;color:var(--text)}
  .dtable td:first-child{color:var(--muted)}
  .dtable tr:last-child td{border-bottom:none}
  .chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
  .chip{font-family:"IBM Plex Mono",monospace;font-size:10px;background:var(--panel2);color:var(--muted);padding:2px 8px;border-radius:999px}
  .chip.hint{color:var(--green)}
  .chip.src{color:var(--dim);background:transparent;padding-left:0}
  .setnote{font-size:12.5px;color:var(--amber2);background:rgba(240,164,74,.07);border-left:2px solid var(--amber);border-radius:0 8px 8px 0;padding:8px 12px;margin-top:8px;line-height:1.45}
  .empty{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--dim);text-align:center;padding:24px;border:1px dashed var(--line);border-radius:12px}
  .findings{font-size:14px;color:var(--muted);margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .err{color:var(--red);font-family:"IBM Plex Mono",monospace;font-size:13px;padding:16px;border:1px solid var(--red);border-radius:12px}
  /* navigation and the Compare / Simulate views (tools.js) */
  .wrap.wide{max-width:1040px}
  .tabs{display:flex;gap:6px;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--line)}
  .tabs a{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--muted);text-decoration:none;padding:7px 14px;border-radius:9px;border:1px solid transparent}
  .tabs a.on{color:var(--ink);background:var(--amber);font-weight:500}
  .tabs a:not(.on):hover{border-color:var(--line);color:var(--text)}
  .lede{color:var(--muted);font-size:14px;margin:-8px 0 14px;max-width:72ch}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .ptitle{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--amber2);margin-bottom:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .lbl{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:14px 0 6px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .panel>.lbl:first-child,.grid2 .lbl{margin-top:0}
  .lbl .hint{letter-spacing:.03em;text-transform:none}
  .hint2{font-size:12px;color:var(--dim);margin-top:8px}
  .dim{color:var(--dim)}
  .srcrow{display:flex;flex-wrap:wrap;gap:8px}
  .srcbtn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:8px 11px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;cursor:pointer;font-family:inherit;font-size:13.5px;text-align:left}
  .srcbtn.on{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
  .srcbtn:disabled{opacity:.45;cursor:not-allowed}
  .srcbtn .cnt{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--dim)}
  .rel{font-family:"IBM Plex Mono",monospace;font-size:10px;padding:1px 8px;border-radius:999px;border:1px solid;white-space:nowrap;text-transform:none;letter-spacing:0}
  .sel,.num{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 10px;font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:14px;max-width:100%}
  .sel{width:100%}
  .sel.mini{width:auto;padding:5px 8px;font-size:13px}
  .num{width:110px;font-family:"IBM Plex Mono",monospace}
  .num.mini{width:74px;padding:5px 8px;font-size:13px}
  .togrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .tog{font-family:"IBM Plex Mono",monospace;font-size:12px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .tog.small{font-size:11px;padding:4px 10px}
  .tog.on{background:#2a2410;border-color:var(--amber);color:var(--amber2)}
  .tog .dash{display:block}
  .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
  .odot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
  input.filter.small{padding:7px 10px;font-size:13px;margin:0 0 8px}
  .picks{display:flex;flex-direction:column;gap:4px;max-height:380px;overflow:auto}
  .pick{display:grid;grid-template-columns:auto auto 1fr;gap:2px 10px;align-items:center;padding:7px 10px;border-radius:9px;background:var(--panel2);border:1px solid transparent;cursor:pointer}
  .pick.on{border-color:var(--line);background:#222a3a}
  .pick.dis{opacity:.45;cursor:not-allowed}
  .pick input{accent-color:var(--amber);width:16px;height:16px}
  .sw{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:12px;line-height:1;border:1px dashed var(--line);color:#0e1016}
  .pn{font-size:14px}
  .pd{grid-column:3;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--dim)}
  .legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:4px 0 10px;font-size:13px}
  .lg{display:inline-flex;align-items:center;gap:6px}
  .lgm{font-size:14px;line-height:1}
  .lgl{display:inline-block;width:18px;height:3px;border-radius:2px}
  .lgl.dashed{height:0;border-top:3px dashed;background:none}
  .lgl.sq{width:12px;height:12px;border-radius:3px}
  .chartbox.tall{height:340px}
  .tscroll{overflow-x:auto;margin-top:12px}
  .ctab{font-size:12px}
  .ctab td,.ctab th{white-space:nowrap}
  .ctab tr.sumrow td{border-top:1px solid var(--line);color:var(--amber2)}
  .warn{font-size:13px;color:var(--amber2);background:rgba(240,164,74,.08);border:1px solid rgba(240,164,74,.35);border-radius:10px;padding:9px 12px;margin:10px 0 0;line-height:1.45}
  .warn b{color:var(--amber)}
  details.conds{margin-top:12px;font-size:13px;color:var(--muted)}
  details.conds summary{cursor:pointer;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--dim)}
  .cond{margin:10px 0 0;font-size:13px}
  ul.how{margin:8px 0 0 18px;line-height:1.55}
  ul.how li{margin-bottom:4px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
  .ways{display:flex;flex-direction:column;gap:6px}
  .way{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border-radius:10px;padding:10px}
  .wdot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;color:#0e1016;font-size:12px;margin-top:2px}
  .wbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
  .wname{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted)}
  .wmeta{font-size:12px;color:var(--dim)}
  .xo{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:4px 10px 4px 46px;font-size:13px}
  .xol{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--amber);text-transform:uppercase;letter-spacing:.1em;min-width:92px}
  .slope{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
  .cmpbtn{background:var(--panel2);border:1px solid var(--amber);color:var(--amber2);border-radius:10px;padding:8px 14px;font-size:14px;margin:0 0 14px 8px;cursor:pointer}
  @media (max-width:640px){ .grid2{grid-template-columns:1fr} .xo{padding-left:10px} .chartbox.tall{height:300px} }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="mono" style="color:var(--dim)">loading…</div></div>

<script>
// ---- editable display label; change this string to rebrand the header ----
const BRAND = "driver database";
const MAIN_DB   = "./drivers.json";
const SURVEY_DB = "./drivers_survey_midbass.json";
const SOURCES_CFG = "./watch/config.json";   // source families; optional

const PALETTE=["#f0a44a","#6fd19a","#7aa2f7","#e98b8b","#c4a3ff","#f6c48a"];
const CONF={high:"#6fd19a",medium:"#f0a44a",low:"#e98b8b",none:"#7b859c"};
const TS=[["Fs","Hz"],["Qts",""],["Vas","L"],["Sd","cm²"],["Xmax","mm"],["Bl","T·m"],["Re","Ω"],["Le","mH"]];
const TS_EXTRA={Vd:"cm³",Pe:"W",sens:"dB",sens1W:"dB/W",Mms:"g",Cms:"mm/N",Qms:"",Qes:"",Z:"Ω"};
const COND={spl_db:v=>v+" dB",distance_mm:v=>v+" mm",drive_v:v=>v+" V",drive_V:v=>v+" V",
            f1:v=>"f1 "+v,f2:v=>"f2 "+v,ratio:v=>v,x_pk_mm:v=>"x̂ "+v+" mm",band:v=>v,
            hpf:v=>v,lab:v=>v,test:v=>v,standard:v=>v,space:v=>v,ref:v=>"re "+v,ref_spl_db:v=>"ref "+v+" dB"};
const ROLE_ORDER=["tweeter","tweeter (waveguide)","midrange","midbass","midbass / mid","midbass (survey)",
                  "woofer / midbass","woofer","woofer (pair)","comparison"];
let DB=null, SURVEY=null, FAMILIES=[], showSurvey=false, charts=[], view={mode:"list",id:null,filter:""};

// Which source a measurement set comes from (watch/config.json "families"); every set belongs to one.
function familyOf(set){
  for(const f of FAMILIES){ try{ if(new RegExp(f.match,"i").test(set.source||"")) return f; }catch(e){} }
  return null;
}
function sourceNames(d){
  const out=[];
  (d.measurements||[]).forEach(m=>{ const f=familyOf(m); if(f && f.kind!=="derived" && !out.includes(f.name)) out.push(f.name); });
  return out;
}

// Comparisons are stored top-level (DB.comparisons[]); surface them as pseudo-records
// so the exact same detail/chart renderer draws them. Each carries its own chart set.
function comparisonRecords(){
  return ((DB&&DB.comparisons)||[]).map(c=>({
    id:c.id, name:c.title, manufacturer:"", role:"comparison", band:"",
    isComparison:true, comparesN:(c.drivers||[]).length, ts:{}, findings:"",
    measurements:[c]   // c already has type/method/source/confidence/chartType/axes/series/note
  }));
}
function allDrivers(){
  const a=(DB&&DB.drivers)?DB.drivers.slice():[];
  if(showSurvey && SURVEY) a.push(...SURVEY.drivers);
  a.push(...comparisonRecords());
  return a;
}
function roleRank(r){const i=ROLE_ORDER.indexOf(r);return i<0?99:i;}

// ---- navigation shared by all views; the part after '#' in the address says which view is open ----
function navHtml(page){
  const t=[["","Drivers"],["compare","Compare"],["simulate","Simulate"]];
  return `<nav class="tabs">${t.map(([h,l])=>`<a href="#${h}" class="${(page===h||(page==="driver"&&h===""))?"on":""}">${l}</a>`).join("")}</nav>`;
}
function clearCharts(){ charts.forEach(c=>c.destroy()); charts=[]; }
function newChart(canvas,cfg){ const c=new Chart(canvas,cfg); charts.push(c); return c; }

function condChips(c,source){
  if(!c||typeof c!=="object") c = c? {note:c}:{};
  let h="";
  for(const[k,v] of Object.entries(c)){ if(v===""||v==null) continue; h+=`<span class="chip">${COND[k]?COND[k](v):k+": "+v}</span>`; }
  const d=Number(c.distance_mm);
  if(d>0&&d!==1000){ const off=20*Math.log10(1000/d); h+=`<span class="chip hint">→1 m: ${off>=0?"+":""}${off.toFixed(1)} dB</span>`; }
  if(source) h+=`<span class="chip src">· ${source}</span>`;
  return h?`<div class="chips">${h}</div>`:"";
}

function fmt(v){ if(v===null||v===undefined||v==="") return "—"; return (typeof v==="number")? (Number.isInteger(v)?v:v.toFixed(2)) : v; }

function renderTable(set){
  const cols=set.columns||[], rows=set.rows||[];
  return `<table class="dtable"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead>`+
    `<tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${fmt(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}

function renderChart(canvas,set){
  const ax=set.axes||{x:{},y:{}};
  const xt=(ax.x?.label||"")+(ax.x?.unit?" ("+ax.x.unit+")":"");
  const yt=(ax.y?.label||"")+(ax.y?.unit?" ("+ax.y.unit+")":"");
  const isBar=set.chartType==="bar";
  const ds=(set.series||[]).map((s,i)=>({
    label:s.name, data:(s.points||[]).map(p=>({x:Number(p.x),y:Number(p.y)})),
    backgroundColor:isBar?"#f0a44a":PALETTE[i%PALETTE.length],
    borderColor:PALETTE[i%PALETTE.length], borderWidth:isBar?0:2,
    pointRadius:0, tension:.25, barThickness:isBar?6:undefined
  }));
  const xType = isBar? "linear" : (ax.x?.scale==="log"?"logarithmic":"linear");
  const grid={color:"#2b3344"}, tickc={color:"#a3acc2",font:{size:10}};
  charts.push(new Chart(canvas,{
    type:isBar?"bar":"line",
    data:{datasets:ds},
    options:{responsive:true,maintainAspectRatio:false,animation:false,parsing:true,
      plugins:{legend:{display:(set.series||[]).length>1,labels:{color:"#a3acc2",font:{size:11},boxWidth:10}}},
      scales:{
        x:{type:xType,title:{display:!!xt,text:xt,color:"#7b859c",font:{size:10}},grid,ticks:tickc},
        y:{title:{display:!!yt,text:yt,color:"#7b859c",font:{size:10}},grid,ticks:tickc}
      }}}));
}

function showList(){
  clearCharts(); document.getElementById("app").classList.remove("wide");
  const q=view.filter.toLowerCase();
  const items=allDrivers().filter(d=>(d.name+d.manufacturer+d.role+d.band+(d.findings||"")).toLowerCase().includes(q));
  items.sort((a,b)=> roleRank(a.role)-roleRank(b.role) || (a.name||"").localeCompare(b.name||""));
  const app=document.getElementById("app");
  const surveyN = SURVEY? SURVEY.drivers.length : 0;
  app.innerHTML=navHtml("")+`<div class="kick"><span style="color:var(--amber)">${BRAND}</span><span style="color:var(--dim)">${items.length} shown</span></div>
    <h1>Driver database</h1>
    <input class="filter" id="flt" placeholder="filter by name, role, finding…" value="${view.filter.replace(/"/g,'&quot;')}">
    <label class="ds"><input type="checkbox" id="surv" ${showSurvey?"checked":""}>
      include midbass IMD survey${surveyN?` (${surveyN} drivers · indicative)`:" (unavailable)"}</label>
    <div id="list"></div>`;
  const list=document.getElementById("list");
  let lastRole=null;
  items.forEach(d=>{
    if(d.role!==lastRole){ const hd=document.createElement("div"); hd.className="rolehdr"; hd.textContent=d.role||"—"; list.appendChild(hd); lastRole=d.role; }
    const n=(d.measurements||[]).length;
    const b=document.createElement("button"); b.className="card";
    const sub = d.isComparison
      ? `compares ${d.comparesN} drivers · ${(d.measurements[0].series||[]).length} series`
      : `${[d.manufacturer,d.band].filter(Boolean).join(" · ")||"—"} · ${n} measurement${n!==1?"s":""}`;
    const srcs=d.isComparison?[]:sourceNames(d);
    b.innerHTML=`<div class="nm">${d.name||"(unnamed)"}</div><div class="sub">${sub}</div>`+
      (srcs.length?`<div class="srcs">${srcs.length>1?srcs.length+" sources: ":"source: "}${srcs.join(" · ")}</div>`:"");
    b.onclick=()=>{ scrollY0=window.scrollY; location.hash="driver/"+encodeURIComponent(d.id); }; list.appendChild(b);
  });
  const f=document.getElementById("flt");
  f.addEventListener("input",e=>{view.filter=e.target.value;showList();setTimeout(()=>{const x=document.getElementById("flt");x.focus();x.setSelectionRange(view.filter.length,view.filter.length);},0);});
  document.getElementById("surv").addEventListener("change",e=>{showSurvey=e.target.checked;showList();});
}

function showDetail(id){
  clearCharts(); document.getElementById("app").classList.remove("wide");
  const d=allDrivers().find(x=>x.id===id);
  const app=document.getElementById("app");
  const extra=Object.entries(TS_EXTRA).filter(([k])=>d.ts && d.ts[k]!=null && d.ts[k]!=="")
              .map(([k,u])=>`<b>${k}</b> ${d.ts[k]}${u?" "+u:""}`).join("  ·  ");
  let h=navHtml("driver")+`<button class="back" id="bk">← all drivers</button>${d.isComparison?"":`<button class="cmpbtn" id="cmpd">compare with other drivers</button>`}<h2>${d.name}</h2>
    <div class="meta">${d.isComparison?("comparison · "+(d.comparesN||0)+" drivers"):[d.manufacturer,d.role,d.band].filter(Boolean).join(" · ")}</div>`;
  if(!d.isComparison){
    h+=`<div class="tsgrid">${TS.map(([k,u])=>`<div class="ts"><div class="k">${k}</div><div class="v">${d.ts&&d.ts[k]!=null&&d.ts[k]!==""?d.ts[k]+(u?'<span style="color:#7b859c;font-size:10px"> '+u+'</span>':''):'—'}</div></div>`).join("")}</div>
    ${extra?`<div class="tsmore">${extra}</div>`:""}`;
  }
  const ms=d.measurements||[];
  // Group the sets by source so data from different sources stays visibly separate.
  const order=FAMILIES.map(f=>f.name);
  const rank=set=>{ const f=familyOf(set); return f? order.indexOf(f.name) : order.length; };
  const idx=ms.map((set,i)=>i).sort((a,b)=>rank(ms[a])-rank(ms[b]) || a-b);
  let lastFam;
  if(ms.length){
    idx.forEach(i=>{
      const set=ms[i];
      if(FAMILIES.length && !d.isComparison){
        const f=familyOf(set), name=f?f.name:"Other";
        if(name!==lastFam){
          const n=ms.filter(x=>(familyOf(x)||{name:"Other"}).name===name).length;
          h+=`<div class="srchdr"><span>${name}${f&&f.reliability?` <b class="relt">· ${f.reliability}</b>`:""}</span><span>${n} set${n!==1?"s":""}</span></div>`;
          lastFam=name;
        }
      }
      const cc=CONF[set.confidence]||CONF.none;
      const isTable=set.chartType==="table";
      const has=isTable? (set.rows||[]).length : (set.series||[]).some(s=>(s.points||[]).length);
      h+=`<div class="setttl"><span>${set.type}${set.method?" · "+set.method:""}</span><span class="conf" style="color:${cc};border:1px solid ${cc}55">${set.confidence||"none"}</span></div>`;
      if(!has){ h+=`<div class="empty">no data</div>`; }
      else if(isTable){ h+=renderTable(set); }
      else { h+=`<div class="chartbox"><canvas id="ch${i}"></canvas></div>`; }
      h+=condChips(set.conditions,set.source);
      if(set.note) h+=`<div class="setnote">${set.note}</div>`;
    });
  } else { h+=`<div class="empty">No measurements yet.</div>`; }
  if(d.findings) h+=`<div class="findings">${d.findings}</div>`;
  app.innerHTML=h;
  document.getElementById("bk").onclick=()=>{ location.hash=""; };
  const cb=document.getElementById("cmpd"); if(cb) cb.onclick=()=>Tools.compareDriver(d.id);
  ms.forEach((set,i)=>{ if(set.chartType!=="table"){ const cv=document.getElementById("ch"+i); if(cv) renderChart(cv,set); } });
}

let scrollY0=0;
function route(){
  const h=location.hash.slice(1), page=h.split("?")[0];
  if(page==="compare") return Tools.showCompare();
  if(page==="simulate") return Tools.showSimulate();
  if(page.startsWith("driver/")){
    const id=decodeURIComponent(page.slice(7));
    if(allDrivers().some(x=>x.id===id) || (SURVEY&&SURVEY.drivers.some(x=>x.id===id))){
      if(!allDrivers().some(x=>x.id===id)) showSurvey=true;
      showDetail(id); window.scrollTo(0,0); return;
    }
  }
  showList(); window.scrollTo(0,scrollY0);
}
function boot(){ window.addEventListener("hashchange",route); route(); }

// "no-cache" re-checks with the server on every visit but only downloads a file again when it changed.
fetch(MAIN_DB,{cache:"no-cache"})
  .then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
  .then(j=>{ DB=j;
    // the survey dataset and the source families are optional; absence is fine
    return Promise.all([
      fetch(SURVEY_DB,{cache:"no-cache"}).then(r=>r.ok?r.json():null).catch(()=>null),
      fetch(SOURCES_CFG,{cache:"no-cache"}).then(r=>r.ok?r.json():null).catch(()=>null)
    ]).then(([s,c])=>{ SURVEY=s; FAMILIES=(c&&c.families)||[]; boot(); });
  })
  .catch(e=>{document.getElementById("app").innerHTML= DB
    ? `<div class="err">The page failed to start: ${e.message}. Check that compare-core.js, sim-core.js and tools.js sit next to index.html.</div>`
    : `<div class="err">Couldn't load drivers.json — ${e.message}. Make sure it sits next to index.html in the repo.</div>`;});
</script>
